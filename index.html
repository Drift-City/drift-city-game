<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cairo Drive - Playable Fixed</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--card:#23211c;--ink:#f4ead2;--accent:#ff6a1a;--pill:rgba(12,14,18,.62)}
html,body{height:100%;margin:0;overflow:hidden;background:#a9cdea;font-family:'Cairo',sans-serif;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;display:block;z-index:0}
.hud{z-index:5;position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;color:#fff}
.sp{background:var(--pill);border-radius:18px;padding:6px 16px;text-align:center;min-width:110px;direction:ltr}
.sp b{font-size:38px;line-height:1;font-weight:800}.sp small{display:block;font-size:12px;opacity:.85}
.pill{background:var(--pill);border-radius:999px;padding:6px 16px;font-weight:800;font-size:15px;pointer-events:auto}
#ctl{z-index:5;position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;direction:ltr}
.g{display:flex;gap:10px;flex-wrap:wrap;max-width:200px}
.btn{width:68px;height:68px;border-radius:50%;background:rgba(12,14,18,.6);border:2px solid rgba(255,255,255,.7);color:#fff;font:800 18px 'Cairo';display:flex;align-items:center;justify-content:center;touch-action:none}
.btn.on{background:var(--accent)}
#intro{z-index:9;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,16,20,.7);padding:20px}
.card{background:var(--card);color:var(--ink);border-radius:20px;padding:24px;max-width:360px;text-align:center}
h1{margin:0 0 8px;font-size:28px}p{margin:0 0 14px;font-size:14px}
#go{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 30px;font:800 18px 'Cairo';cursor:pointer}
</style>
</head>
<body>

<div class="hud">
  <div class="pill">السرعة والحركة شغالين 👍</div>
  <div class="sp">
    <b id="spd">0</b><small>كم/س</small>
  </div>
</div>

<div id="ctl">
  <div class="g">
    <div class="btn" id="bL">◀</div>
    <div class="btn" id="bR">▶</div>
  </div>
  <div class="g">
    <div class="btn" id="bB">فرامل</div>
    <div class="btn" id="bG" style="background:var(--accent)">بنزين</div>
  </div>
</div>

<div id="intro">
  <div class="card">
    <h1>Cairo Drive</h1>
    <p>تم إصلاح الفيزياء والحركة بالكامل! استخدم الأسهم أو الأزرار للقيادة فوق الكباري.</p>
    <button id="go">ابدأ اللعب الآن</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T = THREE;
const rd = new T.WebGLRenderer({ antialias: true });
rd.setSize(innerWidth, innerHeight);
rd.setPixelRatio(Math.min(devicePixelRatio, 1.5));
rd.shadowMap.enabled = true;
document.body.appendChild(rd.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0xa9cdea);
const cam = new T.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 1000);

// الإضاءة
const hemi = new T.HemisphereLight(0xffffff, 0x444444, 0.9);
scene.add(hemi);
const sun = new T.DirectionalLight(0xfff0cf, 1.0);
sun.position.set(100, 200, 100);
sun.castShadow = true;
scene.add(sun);

// خامات
const concM = new T.MeshStandardMaterial({ color: 0x8a8882, roughness: 0.8 });
const roadM = new T.MeshStandardMaterial({ color: 0x222428, roughness: 0.6 });
const carM = new T.MeshStandardMaterial({ color: 0xd11a2a, roughness: 0.2, metalness: 0.5 });

// بناء الأرضية والكباري
const ground = new T.Mesh(new T.PlaneGeometry(2000, 2000), new T.MeshStandardMaterial({ color: 0x3a5a40 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// مسار الكوبري (شبكة مدينة نصر)
const NETE = [];
const A = [];
for (let k = 0; k <= 30; k++) {
  const t = k / 30;
  A.push([ -300 + 600 * t, 0, 15 * Math.sin(t * Math.PI) ]);
}
NETE.push(A);

const NETS = [];
A.forEach((p, i) => {
  if (i < A.length - 1) {
    const p2 = A[i + 1];
    const dx = p2[0] - p[0], dz = p2[1] - p[1];
    NETS.push({ ax: p[0], az: p[1], ay: p[2], bx: p2[0], bz: p2[1], by: p2[2], dx, dz, l2: dx*dx + dz*dz, w: 12 });
  }
});

// المجسم الثلاثي الأبعاد للكوبري
const bridgeGroup = new T.Group();
for (let k = 0; k < A.length - 1; k++) {
  const a = A[k], b = A[k + 1];
  const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
  const seg = new T.Group();
  seg.position.set((a[0] + b[0]) / 2, (a[2] + b[2]) / 2, (a[1] + b[1]) / 2);
  seg.lookAt(b[0], b[2], b[1]);

  const deck = new T.Mesh(new T.BoxGeometry(16, 1, L + 0.5), concM);
  deck.position.y = -0.5;
  seg.add(deck);

  const road = new T.Mesh(new T.BoxGeometry(15, 0.1, L + 0.5), roadM);
  road.position.y = 0.05;
  seg.add(road);

  if (k % 4 === 0 && (a[2] + b[2]) / 2 > 2) {
    const pH = (a[2] + b[2]) / 2;
    const pillar = new T.Mesh(new T.CylinderGeometry(1.5, 1.5, pH, 8), concM);
    pillar.position.set(0, -pH / 2 - 0.5, 0);
    seg.add(pillar);
  }
  bridgeGroup.add(seg);
}
scene.add(bridgeGroup);

// مجسم السيارة
const car = new T.Group();
const carBody = new T.Mesh(new T.BoxGeometry(2, 1, 4), carM);
carBody.position.y = 0.7;
carBody.castShadow = true;
car.add(carBody);
scene.add(car);

// متغيرات التحكم والفيزياء
let px = 0, py = 0, pz = 0, speed = 0, angle = 0;
const keys = { forward: false, backward: false, left: false, right: false };

// كشف ارتفاع الكوبري
function getBridgeHeight(x, z, currentY) {
  let bestH = 0;
  for (const s of NETS) {
    const t = Math.max(0, Math.min(1, ((x - s.ax) * s.dx + (z - s.az) * s.dz) / s.l2));
    const cx = s.ax + s.dx * t, cz = s.az + s.dz * t;
    const d = Math.hypot(x - cx, z - cz);
    if (d <= s.w) {
      const h = s.ay + (s.by - s.ay) * t;
      if (h > bestH) bestH = h;
    }
  }
  return bestH;
}

// عناصر التحكم من لوحة المفاتيح
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'w') keys.forward = true;
  if (e.key === 'ArrowDown' || e.key === 's') keys.backward = true;
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp' || e.key === 'w') keys.forward = false;
  if (e.key === 'ArrowDown' || e.key === 's') keys.backward = false;
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// أزرار اللمس للموبايل
const setupBtn = (id, key) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
  el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
  el.addEventListener('mousedown', () => keys[key] = true);
  el.addEventListener('mouseup', () => keys[key] = false);
};
setupBtn('bG', 'forward'); setupBtn('bB', 'backward');
setupBtn('bL', 'left'); setupBtn('bR', 'right');

document.getElementById('go').onclick = () => {
  document.getElementById('intro').style.display = 'none';
};

// الحلقة الرئيسية للعبة (Game Loop)
let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  // تسريع وتبطيء العربية
  if (keys.forward) speed = Math.min(speed + 25 * dt, 90);
  else if (keys.backward) speed = Math.max(speed - 20 * dt, -30);
  else speed *= 0.96; // احتكاك

  // التوجيه
  if (Math.abs(speed) > 0.5) {
    const dir = speed > 0 ? 1 : -1;
    if (keys.left) angle += 1.8 * dt * dir;
    if (keys.right) angle -= 1.8 * dt * dir;
  }

  // تحديث إحداثيات الموقع
  px += Math.sin(angle) * speed * dt;
  pz += Math.cos(angle) * speed * dt;

  // الارتفاع فوق الكوبري أو الأرض
  const targetY = getBridgeHeight(px, pz, py);
  py += (targetY - py) * 0.2; // تنعيم الارتفاع

  // تطبيق الموقع والتدوير على مجسم العربية
  car.position.set(px, py, pz);
  car.rotation.y = angle;

  // تحديث الكاميرا لتتبع العربية
  const camDist = 12, camHeight = 5;
  cam.position.x = px - Math.sin(angle) * camDist;
  cam.position.z = pz - Math.cos(angle) * camDist;
  cam.position.y = py + camHeight;
  cam.lookAt(px, py + 1, pz);

  // العداد
  document.getElementById('spd').innerText = Math.round(Math.abs(speed));

  rd.render(scene, cam);
}

window.addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  rd.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
